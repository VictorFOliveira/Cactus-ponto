name: Cactus Ponto CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cactus_ponto
          POSTGRES_USER: cactus
          POSTGRES_PASSWORD: cactus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cactus -d cactus_ponto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cactus:cactus_test@localhost:5432/cactus_ponto
      JWT_SECRET: cactus-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Initialize database
        env:
          PGPASSWORD: cactus_test
        run: psql -h localhost -U cactus -d cactus_ponto -f db/init.sql
      - name: API dependencies
        working-directory: api
        run: npm install
      - name: API tests
        working-directory: api
        run: npm test
      - name: Web dependencies
        working-directory: web
        run: npm install
      - name: Build web
        working-directory: web
        run: npm run build
      - name: Validate compose
        run: docker compose config
