name: Cactus Ponto CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cactus_ponto
          POSTGRES_USER: cactus
          POSTGRES_PASSWORD: cactus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cactus -d cactus_ponto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cactus:cactus_test@localhost:5432/cactus_ponto
      REDIS_URL: redis://localhost:6379
      REDIS_PREFIX: cactus:test
      RATE_LIMIT_API: 10000
      RATE_LIMIT_USER: 10000
      RATE_LIMIT_LOGIN: 1000
      RATE_LIMIT_PUNCH: 1000
      JWT_SECRET: cactus-ci-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Initialize database
        env:
          PGPASSWORD: cactus_test
        run: psql -v ON_ERROR_STOP=1 -h localhost -U cactus -d cactus_ponto -f db/init.sql
      - name: API dependencies
        working-directory: api
        run: npm install
      - name: Validate production migrations
        working-directory: api
        run: node -e "import('./src/migrate.js').then(async m=>{await m.migrate();const {pool}=await import('./src/db.js');await pool.end()})"
      - name: API tests
        working-directory: api
        run: npm test
      - name: Web dependencies
        working-directory: web
        run: npm install
      - name: Build web
        working-directory: web
        run: npm run build
      - name: Validate compose
        run: docker compose config


  destructive-regression:
    runs-on: ubuntu-latest
    needs: validate
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cactus_ponto
          POSTGRES_USER: cactus
          POSTGRES_PASSWORD: cactus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cactus -d cactus_ponto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cactus:cactus_test@localhost:5432/cactus_ponto
      REDIS_URL: redis://localhost:6379
      REDIS_PREFIX: cactus:destructive
      JWT_SECRET: cactus-destructive-regression-secret
      NODE_ENV: test
      RATE_LIMIT_API: 10000
      RATE_LIMIT_USER: 10000
      RATE_LIMIT_LOGIN: 1000
      RATE_LIMIT_PUNCH: 1000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Initialize clean database
        env:
          PGPASSWORD: cactus_test
        run: psql -v ON_ERROR_STOP=1 -h localhost -U cactus -d cactus_ponto -f db/init.sql
      - name: API dependencies
        working-directory: api
        run: npm install
      - name: Apply all migrations
        working-directory: api
        run: node -e "import('./src/migrate.js').then(async m=>{await m.migrate();const {pool}=await import('./src/db.js');await pool.end()})"
      - name: Destructive regression
        working-directory: api
        run: node --test --test-concurrency=1 regression/destructive.test.js
