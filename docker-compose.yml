services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cactus_ponto
      POSTGRES_USER: cactus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cactus_dev}
    volumes:
      - ponto_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cactus -d cactus_ponto"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server","--save","","--appendonly","no","--maxmemory-policy","allkeys-lru"]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./api
    environment:
      PORT: 3333
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-cactus-local-development-secret-change-before-production-123456}
      DATABASE_URL: postgresql://cactus:${POSTGRES_PASSWORD:-cactus_dev}@db:5432/cactus_ponto
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_PREFIX: ${REDIS_PREFIX:-cactus:ponto}
      CACHE_TTL_BRANDING: ${CACHE_TTL_BRANDING:-120}
      CACHE_TTL_DOMAIN: ${CACHE_TTL_DOMAIN:-120}
      CACHE_TTL_DASHBOARD: ${CACHE_TTL_DASHBOARD:-20}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      RATE_LIMIT_API: ${RATE_LIMIT_API:-240}
      RATE_LIMIT_USER: ${RATE_LIMIT_USER:-180}
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-10}
      RATE_LIMIT_PUNCH: ${RATE_LIMIT_PUNCH:-4}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_API_URL: ${ASAAS_API_URL:-https://api-sandbox.asaas.com/v3}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
      CACTUS_PONTO_PLAN_NAME: ${CACTUS_PONTO_PLAN_NAME:-STANDARD}
      CACTUS_PONTO_PLAN_PRICE: ${CACTUS_PONTO_PLAN_PRICE:-0}
      BILLING_SUSPEND_ON_OVERDUE: ${BILLING_SUSPEND_ON_OVERDUE:-true}
      CACTUS_PONTO_BASE_DOMAIN: ${CACTUS_PONTO_BASE_DOMAIN:-ponto.cactustecnologia.com.br}
      CACTUS_PONTO_CUSTOM_CNAME: ${CACTUS_PONTO_CUSTOM_CNAME:-custom.ponto.cactustecnologia.com.br}
      CACTUS_PONTO_PUBLIC_SCHEME: ${CACTUS_PONTO_PUBLIC_SCHEME:-https}
    ports:
      - "3333:3333"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  ponto_data:
