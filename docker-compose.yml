services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cactus_ponto
      POSTGRES_USER: cactus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cactus_dev}
    volumes:
      - ponto_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cactus -d cactus_ponto"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://cactus:${POSTGRES_PASSWORD:-cactus_dev}@db:5432/cactus_ponto
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  ponto_data:
